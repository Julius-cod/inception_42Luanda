server {
    # ─── Portas e SSL ──────────────────────────────────────
    listen 443 ssl;
    listen [::]:443 ssl;

    server_name juliados.42.fr www.juliados.42.fr;

    ssl_certificate /etc/ssl/certs/nginx-selfsigned.crt;
    ssl_certificate_key /etc/ssl/private/nginx-selfsigned.key;

    ssl_protocols TLSv1.2 TLSv1.3;

    # ─── WordPress ─────────────────────────────────────────
    root /var/www/wordpress;
    index index.php index.html index.htm;

    client_max_body_size 64M;

    location / {
        try_files $uri $uri/ /index.php?$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass wordpress:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    # ─── BÓNUS: Adminer (proxy reverso) ────────────────────
    # ─── BÓNUS: Adminer (proxy reverso) ────────────────────
    location /adminer/ {
        proxy_pass http://adminer:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── BÓNUS: Website estático ───────────────────────────
    location /static/ {
        proxy_pass http://static:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ─── BÓNUS: cAdvisor (proxy reverso) ───────────────────
    location /cadvisor/ {
        proxy_pass http://cadvisor:8080/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Desabilita gzip para permitir sub_filter
        proxy_set_header Accept-Encoding "";

        # Reescreve links absolutos do cAdvisor
        sub_filter 'href="/' 'href="/cadvisor/';
        sub_filter 'src="/' 'src="/cadvisor/';
        sub_filter 'action="/' 'action="/cadvisor/';
        sub_filter_once off;
        sub_filter_types text/html text/css application/javascript;
    }

    # ─── Segurança ─────────────────────────────────────────
    location ~ /\.ht {
        deny all;
    }
}